# Shared test configuration (included by the test.*.yaml files)
external_components:
  - source:
      type: local
      path: ../components
    components: [dfrobot_i2c_rgbbutton]

i2c:
  - id: bus_a
    sda: ${sda_pin}
    scl: ${scl_pin}

dfrobot_i2c_rgbbutton:
  - id: button_1
    address: 0x23
    i2c_id: bus_a
    brightness: 60%
    blink_interval: 1s
    refresh_interval: 30s
    long_press_time: 800ms
    multi_click_time: 300ms
    on_click:
      - dfrobot_i2c_rgbbutton.set_color:
          id: [button_1, button_2]
          color: orange
          blink: true
    on_double_click:
      - dfrobot_i2c_rgbbutton.set_color:
          id: button_2
          color: red
          alternate_color: blue
    on_triple_click:
      - dfrobot_i2c_rgbbutton.set_brightness:
          id: [button_1, button_2]
          brightness: !lambda "return id(button_1).get_brightness() > 0.5f ? 0.2f : 1.0f;"
    on_long_press:
      - if:
          condition:
            dfrobot_i2c_rgbbutton.is_locked: button_2
          then:
            - dfrobot_i2c_rgbbutton.unlock: button_2
          else:
            - dfrobot_i2c_rgbbutton.lock: [button_2]
      - if:
          condition:
            and:
              - dfrobot_i2c_rgbbutton.is_connected: button_2
              - dfrobot_i2c_rgbbutton.is_pressed:
                  id: button_2
          then:
            - logger.log: "button 2 pressed"
  - id: button_2
    address: 0x24
    interrupt_pin: ${int_pin}
    default_color: green

binary_sensor:
  - platform: dfrobot_i2c_rgbbutton
    dfrobot_i2c_rgbbutton_id: button_1
    id: button_1_pressed
    on_press:
      - dfrobot_i2c_rgbbutton.set_color:
          id: button_2
          color: red
      - dfrobot_i2c_rgbbutton.set_color:
          id: button_1
          red: 0
          green: 128
      - dfrobot_i2c_rgbbutton.set_color:
          id: button_1
          color: !lambda "return id(button_2).get_button_state() ? 0x0000FF : 0xFFFFFF;"
    on_release:
      - dfrobot_i2c_rgbbutton.set_color:
          id: button_2
          color: off
      - dfrobot_i2c_rgbbutton.set_color:
          id: button_1
          color: "#8B00FF"
      - lambda: |-
          id(button_2).set_button_color(0x00FF00);
          id(button_2).set_button_color(255, 127, 0, true);
          id(button_2).set_button_color(id(button_2)->eGeneralRGBValue_t::eBlack);
          id(button_2).set_color(id(button_2).eRed);
          id(button_2).set_color(10, 20, 30);
          const uint8_t *rgb = id(button_2).get_button_color_rgb();
          ESP_LOGD("test", "r=%u", rgb[0]);
          ESP_LOGD("test", "color 0x%06" PRIX32, id(button_2).get_button_color_hex());
  - platform: dfrobot_i2c_rgbbutton
    dfrobot_i2c_rgbbutton_id: button_2
    name: Second button
    filters:
      - delayed_off: 20ms

  - platform: dfrobot_i2c_rgbbutton
    dfrobot_i2c_rgbbutton_id: button_1
    type: connected
  - platform: dfrobot_i2c_rgbbutton
    dfrobot_i2c_rgbbutton_id: button_2
    type: connected
    name: Second button connected

event:
  - platform: dfrobot_i2c_rgbbutton
    dfrobot_i2c_rgbbutton_id: button_2
    on_event:
      - logger.log:
          format: "event %s"
          args: [event_type.c_str()]

script:
  - id: test_api
    then:
      - dfrobot_i2c_rgbbutton.set_brightness:
          id: button_2
          brightness: 50%
      - dfrobot_i2c_rgbbutton.set_color:
          id: button_2
          color: green
          blink: !lambda "return id(button_1).get_button_state();"
      - lambda: |-
          id(button_2)->blink(0xFF0000, 0x0000FF);
          id(button_2)->set_brightness(0.5f);
          id(button_2)->lock();
          id(button_2)->unlock();
          ESP_LOGD("test", "%d %d %d", id(button_2)->is_blinking(), id(button_2)->is_locked(),
                   id(button_2)->is_connected());

light:
  - platform: dfrobot_i2c_rgbbutton
    dfrobot_i2c_rgbbutton_id: button_1
    id: button_1_led
    restore_mode: RESTORE_DEFAULT_OFF
